name: Kneeva CI/CD — Non-Blocking Test & Render Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Automated Verification & Cloud Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ------------------------------------------------------------------------
      # Non-Blocking Test Step:
      # continue-on-error: true guarantees that flaky or experimental tests
      # will never halt cloud deployment during hackathon time constraints.
      # ------------------------------------------------------------------------
      - name: 🧪 Run Pytest Test Suite (Non-Blocking)
        id: run_tests
        continue-on-error: true
        run: |
          pytest backend/test_server_triage.py backend/test_backend.py -v --tb=short

      - name: 📢 Report Test Status
        run: |
          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            echo "✅ All automated unit and contract tests passed successfully."
          else
            echo "⚠️ [NON-BLOCKING WARNING] Some tests failed or warned, but continuing deployment as configured."
          fi

      # ------------------------------------------------------------------------
      # Cloud Deployment Step:
      # Pings the Render Deploy Hook securely via GitHub Secrets.
      # ------------------------------------------------------------------------
      - name: 🚀 Trigger Render Cloud Deployment Webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "📡 Pinging Render deploy hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            echo "Render webhook responded with HTTP $HTTP_STATUS."
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "🎉 Render deployment triggered successfully."
            else
              echo "⚠️ Render webhook returned non-200 status, check Render Dashboard."
            fi
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK secret is not set in repository settings. Triggering live health check ping..."
            curl -s -f "https://kneeva-api.onrender.com/health" || true
            echo "Pinged https://kneeva-api.onrender.com/health to wake container."
          fi
